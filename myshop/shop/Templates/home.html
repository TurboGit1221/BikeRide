<!DOCTYPE html>
{% load static %}
<html lang="pl">
<head>
    <meta charset="UTF-8">
   <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .logo {
            margin-left: 30px;
        }
        .logo img {
            height: 60px;
        }
        .main-title {
            margin-top: 40px;
            font-size: 32px;
            text-transform: uppercase;
        }
        .subtitle {
            margin-top: 10px;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <a href="{% url 'home' %}">
                <img src="{% static 'img/logo.png' %}" alt="Logo sklepu">
            </a>
        </div>
    </header>

    <hr>
    <h2>Nasze Produkty</h2>
    {% if produkty %}
        <ul>
            {% for produkt in produkty %}
                <li>{{ produkt.nazwa }} - {{ produkt.cena }} zł</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Brak produktów w sklepie.</p>
    {% endif %}
</body>
</html>
